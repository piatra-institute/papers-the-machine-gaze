claims:
- id: abs-peak-lo
  kind: computation
  passage: Self-sorting arrays with cell-level algorithms, reproduced after Zhang, Goldstein and Levin,
    all compute the same function, yet arrays that mix two algorithms cluster by algorithm while they
    sort, reaching aggregation of 0.59 to 0.65 where label-matched controls stay at 0.49, and at the same
    observed sortedness the remaining work differs 11-fold between algorithms.
  evidence:
    file: simulation/output/results.json
    run_id: model
    pointer: /sorting/mixes/0/peak_of_mean
    reported: '0.59'
    units: aggregation
    conditions: cell-level sorting, 100 cells, values 0-99 shuffled, random sequential updates, 100 runs
      per condition, bubble+selection, peak of mean curve
    decimals: 2
