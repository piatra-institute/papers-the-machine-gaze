- id: def-machine
  kind: definition
  passage: The pair $(Z, G)$ is then the machine that the system realizes under $\pi$ on $R$, and the
    fibres $\pi^{-1}(z)$ are the distinctions the machine does not draw.
  rationale: 'Central definition: a machine is the quotient under which the dynamics close on a regime;
    equivalent to lumpability for stochastic systems.'
- id: def-gaze
  kind: definition
  passage: The machine gaze is the use of $(Z,G)$ in place of $(X,F)$ outside the regime on which closure
    holds, or the treatment of the fibres as if they were empty.
  rationale: Definitions of the machine gaze and machinization, stated in terms of the closure condition.
- id: def-defect
  kind: definition
  passage: A convenient measure of the defect, for a future observed quantity $Y$, is the conditional
    mutual information $I(Y; X \mid \pi(X))$, which vanishes exactly when the distribution of $Y$ depends
    on $x$ only through $\pi(x)$.
  rationale: Closure defect as conditional mutual information; zero iff the future observed quantity depends
    on the state only through the observation.
- id: asm-sort
