      0.21, sensor 0.83, bisection on the residual damping ratio
    decimals: 4
- id: abs-40
  kind: computation
  passage: In an organisation whose throughput is observed and whose repertoire for absorbing disturbances
    is not, ascent on observed throughput removes all maintenance and cuts long-run output to 40% of the
    optimum, at the policy under which the system closes exactly under its observation.
  evidence:
    file: simulation/output/results.json
    run_id: model
    pointer: /slack/gaze/late_over_star
    reported: 40%
    units: percent of optimal long-run output
    conditions: organisation model N=10, K=20, rho=1, delta=0.05, nu=0.005, tau=800; finite-difference
      ascent, windows of 10, probe 0.02, step 0.01, pairs with a stoppage set aside, run of 2e6, second
      half of the run
    decimals: 0
    scale: 100
